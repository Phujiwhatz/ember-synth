<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pulse 16 harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/plugins/pulse16.css">
<style>
  html{background:#0f0e0d;color:#ddd;font:14px system-ui,sans-serif}
  body{margin:0}
  .hbar{display:flex;gap:10px;align-items:center;padding:8px 16px}
  .hbar button{font:600 14px system-ui;padding:5px 14px}
  #host{width:var(--w,1180px);height:var(--h,580px);margin:0 0 0 16px}
  #host>.plug{height:100%}
</style>
<script>if (/noworklet/.test(location.search)) window.__P16_NO_WORKLET = true;</script>
<script src="mock-studio.js"></script>
<script src="../src/plugins/pulse16.js"></script>
</head><body>
<div class="hbar">
  <button id="play">Play</button><button id="stop">Stop</button>
  BPM <input id="bpm" type="number" value="120" min="40" max="240" style="width:60px">
  <span id="rms"></span>
</div>
<div id="host"></div>
<script>
  var m = /w=(\d+)/.exec(location.search); if (m) document.getElementById('host').style.setProperty('--w', m[1] + 'px');
  window.p16Ready = MockStudio.boot('pulse16', document.getElementById('host')).then(function (p) { window.p16 = p; return p.engineType; });
  document.getElementById('play').onclick = function () { Studio.ctx.resume(); Studio.transport.setBpm(+document.getElementById('bpm').value); Studio.transport.start(); };
  document.getElementById('stop').onclick = function () { Studio.transport.stop(); };
  setInterval(function () { document.getElementById('rms').textContent = 'RMS ' + MockStudio.rms().toFixed(3); }, 200);
</script>
</body></html>
