name: Build Ember Ultimate app (macOS)

on:
  push:
    branches: [ultimate]
    paths: ['ultimate/**', '.github/workflows/build-ultimate-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the offline studio (one HTML file with all samples)
        run: |
          cd ultimate
          python3 build.py
          mkdir -p app/studio
          cp dist/ember-ultimate.html app/studio/index.html
          ls -la app/studio

      - name: Package the Mac app (Apple Silicon + Intel)
        run: |
          cd ultimate/app
          npm install --no-audit --no-fund
          npm run package
          ls out
          APP="out/Ember Ultimate-darwin-universal/Ember Ultimate.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p ../../out
          cp -R "$APP" ../../out/
          cp README.txt ../../out/

      - name: Smoke-test (launch + screenshot)
        continue-on-error: true
        run: |
          open "out/Ember Ultimate.app"
          sleep 20
          pgrep -fl "Ember Ultimate" && echo "APP RUNNING"
          screencapture -x app-screenshot.png || true
          osascript -e 'quit app "Ember Ultimate"' || pkill -f "Ember Ultimate" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshot
          path: app-screenshot.png
          if-no-files-found: ignore

      - name: Zip
        run: |
          cd out && ditto -c -k --sequesterRsrc --keepParent . "../Ember-Ultimate-macOS.zip" && cd ..
          ls -la Ember-Ultimate-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Ultimate-macOS
          path: Ember-Ultimate-macOS.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ultimate-v1.0.${{ github.run_number }}"
          gh release create "$TAG" Ember-Ultimate-macOS.zip --target "${{ github.sha }}" \
            --title "Ember Ultimate app 1.0.${{ github.run_number }}" \
            --notes "Ember Ultimate for macOS (Apple Silicon and Intel): Ember Studio, Keys, Acid and Drift in one offline app. Download Ember-Ultimate-macOS.zip, unzip it, drag Ember Ultimate.app to Applications, then right-click it > Open the first time."
